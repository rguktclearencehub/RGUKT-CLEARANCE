<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGUKT Clearance Hub Animation</title>
<style>
:root{--red:#d91515;--ink:#111;--gold:#b8944f;--paper:#faf7ef}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:url('/back.jpeg') center/cover no-repeat;font-family:Arial,sans-serif}
.stage{height:100vh;min-height:620px;display:flex;flex-direction:column;align-items:center;padding-top:3vh}
.logo{width:min(210px,27vw);height:min(210px,27vw);object-fit:contain;mix-blend-mode:multiply;opacity:0;transform:scale(.35) translateY(-35px);animation:logo .85s cubic-bezier(.2,.9,.3,1.3) .15s forwards}
.title{display:flex;gap:12px;margin-top:10px;font-size:clamp(25px,4.2vw,42px);font-weight:900;font-size:30px;}
.title span{opacity:0;transform:translateY(12px);filter:blur(4px)}
.r{color:var(--red);animation:word .55s ease 1.05s forwards}.h{color:var(--ink);animation:word .55s ease 1.28s forwards;}
.scene{position:relative;width:min(720px,88vw);height:min(455px,58vh);margin-top:4vh}
.card{position:absolute;inset:0;background:var(--paper);padding:15px;border-radius:7px;box-shadow:0 25px 55px #0003;opacity:0;transform:translateX(-120%) rotate(-5deg);animation:card .9s cubic-bezier(.16,.8,.28,1) 1.75s forwards}
.inner{height:100%;border:1.5px solid var(--gold);position:relative;padding:26px;display:flex;flex-direction:column;align-items:center}
.inner:before{content:"";position:absolute;inset:6px;border:1px solid var(--gold)}
h1{margin:6px 0 0;font:400 clamp(25px,4vw,37px) Georgia;letter-spacing:5px}
h2{margin:7px 0;color:#8b1424;font-size:12px;letter-spacing:4px}.line{width:120px;height:1px;background:var(--gold);margin:14px 0}
.copy{text-align:center;color:#444;max-width:470px;font:15px/1.7 Georgia}
.footer{margin-top:auto;width:100%;display:flex;justify-content:space-between;color:#555;font-size:12px}
.footer span{border-bottom:1px solid #aaa;padding-bottom:3px;min-width:135px}
.stamp{position:absolute;right:-1%;bottom:7%;width:150px;height:150px;z-index:5;opacity:0;filter:drop-shadow(0 15px 15px #0005);transform-origin:center;animation:fly .55s cubic-bezier(.3,.6,.4,1) 2.8s forwards,press .32s ease 3.35s forwards,lift .5s ease-in 3.85s forwards}
.ring{width:100%;height:100%;border:4px solid #111;border-radius:50%;background:#fff;padding:7px}
.ring img{width:100%;height:100%;object-fit:contain}
.imprint{position:absolute;right:7%;bottom:8%;width:92px;height:92px;border:3px solid var(--ink);border-radius:50%;padding:6px;opacity:0;transform:scale(.45) rotate(-8deg);animation:imp .35s ease 3.62s forwards}
.imprint img{width:100%;height:100%;object-fit:contain;opacity:.8}
.replay{position:fixed;right:15px;bottom:15px;border:0;border-radius:999px;background:var(--red);color:#fff;padding:9px 15px;font-weight:bold;z-index:20}
@keyframes logo{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes word{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes card{to{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes fly{0%{opacity:0;transform:translate(110px,-150px) scale(.7) rotate(-20deg)}100%{opacity:1;transform:translate(0) scale(1) rotate(-8deg)}}
@keyframes press{0%{transform:scale(1) rotate(-8deg)}45%{transform:translate(-5px,12px) scale(.88) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg)}}
@keyframes lift{to{opacity:0;transform:translate(70px,-160px) scale(.72) rotate(10deg)}}
@keyframes imp{0%{opacity:0;transform:scale(.45) rotate(-8deg)}65%{opacity:.85;transform:scale(1.12) rotate(-8deg)}100%{opacity:.72;transform:scale(1) rotate(-8deg)}}
@media(max-width:600px){.scene{height:455px}.stamp{width:105px;height:105px}.inner{padding:20px 15px}.copy{font-size:13px}}
</style></head>
